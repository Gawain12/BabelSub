name: Build & Release Bundles

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build All-in-One Bundles
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: darwin
            arch: arm64
            artifact_name: babelsub-darwin-arm64
            ext: ""
          - os: ubuntu-latest
            platform: linux
            arch: amd64
            artifact_name: babelsub-linux-amd64
            ext: ""
          - os: windows-latest
            platform: windows
            arch: amd64
            artifact_name: babelsub-windows-amd64
            ext: ".exe"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller ffsubsync

      - name: Build Standalone ffsubsync
        shell: bash
        run: |
          mkdir -p bundle
          ENTRY_SCRIPT=$(python -c 'import ffsubsync, os; print(os.path.join(os.path.dirname(ffsubsync.__file__), "ffsubsync.py"))')
          pyinstaller --noconfirm --clean --onefile \
            --additional-hooks-dir=scripts/hooks \
            --name "ffsubsync${{ matrix.ext }}" \
            --collect-all ffsubsync \
            "$ENTRY_SCRIPT"
          cp dist/ffsubsync${{ matrix.ext }} bundle/

      - name: Build BabelSub Core Binary
        shell: bash
        run: |
          go build -ldflags="-s -w" -o "bundle/babelsub${{ matrix.ext }}" ./cmd/babelsub

      - name: Create Distribution Archive
        shell: bash
        run: |
          cd bundle
          if [ "${{ matrix.platform }}" = "windows" ]; then
            7z a "../${{ matrix.artifact_name }}.zip" *
          else
            tar -czvf "../${{ matrix.artifact_name }}.tar.gz" *
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            *.zip
            *.tar.gz

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.zip
            *.tar.gz
          draft: false
          prerelease: false
          generate_release_notes: true
