function onChange(e) {
  const el = e.target, bind = el.dataset.bind;
  if (bind === 'lang') { S.filter.lang = el.value; S.filter.page = 1; saveFilter(); loadMovies(); return; }
  if (bind === 'sort') { S.filter.sort = el.value; S.filter.page = 1; saveFilter(); renderLibrary(); return; }
  if (bind === 'size') { S.filter.size = +el.value; S.filter.page = 1; saveFilter(); renderLibrary(); return; }
  if (bind === 'jump') { gotoPage(+el.value); return; }
  if (bind === 'localLang') { const b = S.local.builder; b.lang = el.value; autoPick(b, localOptions()); renderLocal(); return; }
  if (['slot', 'sync', 'output', 'refresh'].includes(bind)) {
    const ctx = ctxFor(el), b = ctx.builder;
    if (bind === 'slot') {
      b[el.dataset.slot] = el.value || null;
      if (!b.syncTouched) { const opts = optionsFor(ctx); const p = opts.find(o => o.key === b.primary), s = opts.find(o => o.key === b.secondary); b.sync = p && s && p.source.kind === 'track' && s.source.kind === 'track' && p.source.path === s.source.path ? 'none' : 'primary'; }
    }
    if (bind === 'sync') { b.sync = el.value; b.syncTouched = true; }
    if (bind === 'output') { b.output = el.value; b.outputTouched = true; }
    if (bind === 'refresh') b.refresh = el.checked;
    rerender(ctx);
    return;
  }
  if (el.dataset.draft && el.type === 'checkbox') { setPath(settingsDraft, el.dataset.draft, el.checked); return; }
  if (el.dataset.draft && el.tagName === 'SELECT') { setPath(settingsDraft, el.dataset.draft, el.value); renderSettings(); return; }
  if (el.dataset.color) { setPath(settingsDraft, el.dataset.color, hexToAss(el.value)); $('#stylePreview').innerHTML = stylePreviewHTML(settingsDraft.styling); layoutPreview(); }
}

    return;
  }
  if (el.dataset.draft && el.tagName === 'INPUT' && el.type !== 'checkbox') {
    setPath(settingsDraft, el.dataset.draft, el.dataset.num !== undefined ? (parseInt(el.value, 10) || 0) : el.value);
    if (el.dataset.draft.startsWith('styling.')) { if (el.dataset.draft === 'styling.font_name') $('#stylePreview').innerHTML = stylePreviewHTML(settingsDraft.styling); layoutPreview(); }
    return;
  }
  if (el.dataset.map !== undefined) { settingsDraft.path_mappings[+el.dataset.map][el.dataset.mk] = el.value; return; }
}

function onKey(e) {
  const typing = /INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName);
  if (e.key === 'Escape') {
    if ($('#modalRoot').innerHTML) { closeModal(); return; }
    if (S.drawer) { showDrawer(false); return; }
    if (typing) document.activeElement.blur();
    return;
  }
  if (e.key === 'Enter' && typing) {
    const el = document.activeElement;
    if (el.id === 'localPathInput') actions.goPath();
    else if (el.dataset.bind === 'onlineQuery') searchOnline(ctxFor(el), el.value);
    else if (el.dataset.manual) applyManual(ctxFor(el), el.dataset.manual);
    else if (el.dataset.bind === 'jump') gotoPage(+el.value);
    return;
  }
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === '/' && S.view === 'library') { e.preventDefault(); $('#q')?.focus(); }
  if (S.view === 'library' && !S.drawer && !$('#modalRoot').innerHTML) {
    if (e.key === 'ArrowLeft') gotoPage(S.filter.page - 1);
    if (e.key === 'ArrowRight') gotoPage(S.filter.page + 1);
  }
}

function applyManual(ctx, slot) {
  const input = $(`[data-manual=${slot}]`);
  const p = input?.value.trim();
  if (!p) return;
  const b = ctx.builder, name = baseName(p);
  if (!b.uploads.some(u => u.path === p)) b.uploads.push({ path: p, name, language: guessLangClient(name) });
  b[slot] = 'file:' + p;
  b.manual[slot] = false;
  rerender(ctx);
}

async function onFilePicked(e) {
  const file = e.target.files[0];
  if (!file || !uploadCtx) return;
  const fd = new FormData(); fd.append('file', file);
  try {
    const r = await api('/api/upload', { method: 'POST', body: fd });
    const b = uploadCtx.builder;
    b.uploads.push({ path: r.path, name: r.name, language: r.language });
    b[uploadSlot] = 'file:' + r.path;
    rerender(uploadCtx);
    toast('已上传 ' + r.name, 'ok', 1800);
  } catch (err) { toast(err.message, 'err'); }
}

window.addEventListener('resize', layoutPreview);
new MutationObserver(() => { if ($('#stylePreview')) layoutPreview(); }).observe($('#modalRoot'), { childList: true });
boot();
</script>
</body>
