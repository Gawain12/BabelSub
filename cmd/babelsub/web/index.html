<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>BabelSub (巴别字幕) - 专为外语学习打造的媒体库双语字幕系统</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0d1117; color: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; }
  </style>
</head>
<body class="p-6">
  <div class="max-w-6xl mx-auto">
    <!-- Header -->
    <div class="flex items-center justify-between pb-6 mb-4 border-b border-[#30363d]">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-lg bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center text-white text-xl shadow-lg shadow-blue-500/20">
          <i class="fa-solid fa-earth-asia"></i>
        </div>
        <div>
          <h1 class="text-2xl font-bold text-white flex items-center gap-2">
            BabelSub <span class="text-xs px-2 py-0.5 rounded bg-blue-900/60 text-blue-300 font-normal border border-blue-700">Language Immersion</span>
          </h1>
          <p class="text-xs text-gray-400">打破巴别塔的语言壁垒 · 零扫盘 · 毫秒级对轴 · 媒体库外语双语伴读系统</p>
        </div>
      </div>
      <div class="flex gap-2">
        <button onclick="openConfigModal()" class="px-4 py-2 bg-[#21262d] hover:bg-[#30363d] text-white rounded text-sm flex items-center gap-2 border border-[#30363d]">
          <i class="fa-solid fa-gear"></i> 服务器设置
        </button>
        <button onclick="loadMovies()" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded text-sm flex items-center gap-2">
          <i class="fa-solid fa-rotate"></i> 检索影视库
        </button>
      </div>
    </div>

    <!-- Notice Banner -->
    <div class="bg-[#161b22] border border-[#30363d] rounded p-3 mb-6 flex items-center justify-between text-xs text-gray-400">
      <span><i class="fa-solid fa-circle-info text-blue-400 mr-1.5"></i> 提示：本工具仅负责字幕对轴、格式排版与媒体库回写，字幕内容取自对应公开源或原盘轨。</span>
      <span class="text-gray-500">v0.1.0</span>
    </div>

    <!-- Filter & Status Bar -->
    <div class="card p-4 mb-6 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-4">
        <div class="flex items-center gap-2">
          <label class="text-sm text-gray-400">学习目标语言:</label>
          <select id="langSelect" onchange="loadMovies()" class="bg-[#0d1117] border border-[#30363d] text-white text-sm rounded px-3 py-1.5">
            <option value="ja" selected>日语 (Japanese)</option>
            <option value="en">英语 (English)</option>
            <option value="fr">法语 (French)</option>
            <option value="ko">韩语 (Korean)</option>
          </select>
        </div>
        <div class="flex items-center gap-2">
          <input type="checkbox" id="missingOnly" onchange="filterList()" class="rounded bg-[#0d1117] border-[#30363d]">
          <label for="missingOnly" class="text-sm text-gray-300">仅显示未就绪双语的电影</label>
        </div>
      </div>
      <div id="statsBadge" class="text-sm text-gray-400">正在获取...</div>
    </div>

    <!-- Movie Table -->
    <div class="card overflow-hidden">
      <table class="w-full text-left text-sm">
        <thead class="bg-[#21262d] text-gray-300">
          <tr>
            <th class="p-3">电影名称</th>
            <th class="p-3">年份</th>
            <th class="p-3">音轨 / 字幕轨</th>
            <th class="p-3">双语学习就绪状态</th>
            <th class="p-3 text-right">操作</th>
          </tr>
        </thead>
        <tbody id="movieTableBody" class="divide-y divide-[#30363d]">
          <tr><td colspan="5" class="p-8 text-center text-gray-500">加载中...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Config Modal -->
  <div id="configModal" class="fixed inset-0 bg-black/70 hidden flex items-center justify-center p-4 z-50">
    <div class="card max-w-md w-full p-6">
      <h3 class="text-lg font-bold text-white mb-4">媒体库连接设置</h3>
      <div class="space-y-4">
        <div>
          <label class="block text-xs text-gray-400 mb-1">服务类型</label>
          <select id="cfgType" class="w-full bg-[#0d1117] border border-[#30363d] rounded p-2 text-white text-sm">
            <option value="emby">Emby</option>
            <option value="jellyfin">Jellyfin</option>
            <option value="plex">Plex</option>
          </select>
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1">服务器地址 (Host)</label>
          <input id="cfgHost" type="text" placeholder="http://192.168.1.100:8096" class="w-full bg-[#0d1117] border border-[#30363d] rounded p-2 text-white text-sm">
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1">API Token / Key</label>
          <input id="cfgToken" type="password" placeholder="Emby API Key 或 Plex Token" class="w-full bg-[#0d1117] border border-[#30363d] rounded p-2 text-white text-sm">
        </div>
      </div>
      <div class="flex justify-end gap-2 mt-6">
        <button onclick="closeConfigModal()" class="px-4 py-2 bg-[#21262d] text-gray-300 rounded text-sm">取消</button>
        <button onclick="saveConfig()" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded text-sm">测试并保存</button>
      </div>
    </div>
  </div>

  <script>
    let allMovies = [];

    async function fetchConfig() {
      const res = await fetch('/api/config');
      const cfg = await res.json();
      document.getElementById('cfgType').value = (cfg.server && cfg.server.type) || 'emby';
      document.getElementById('cfgHost').value = (cfg.server && cfg.server.host) || '';
      document.getElementById('cfgToken').value = (cfg.server && cfg.server.token) || '';
      if (!cfg.server || !cfg.server.host || !cfg.server.token) {
        openConfigModal();
      } else {
        loadMovies();
      }
    }

    function openConfigModal() { document.getElementById('configModal').classList.remove('hidden'); }
    function closeConfigModal() { document.getElementById('configModal').classList.add('hidden'); }

    async function saveConfig() {
      const data = {
        server: {
          type: document.getElementById('cfgType').value,
          host: document.getElementById('cfgHost').value,
          token: document.getElementById('cfgToken').value
        },
        language: {
          target_audio: document.getElementById('langSelect').value,
          native_sub: 'zh'
        }
      };
      const res = await fetch('/api/config', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data)
      });
      if (res.ok) {
        closeConfigModal();
        loadMovies();
      } else {
        const err = await res.text();
        alert('保存失败: ' + err);
      }
    }

    async function loadMovies() {
      const lang = document.getElementById('langSelect').value;
      document.getElementById('statsBadge').innerText = '正在零扫盘检索媒体库条目...';
      try {
        const res = await fetch('/api/movies?lang=' + lang);
        if (!res.ok) throw new Error(await res.text());
        const data = await res.json();
        allMovies = data.movies || [];
        filterList();
      } catch (e) {
        document.getElementById('movieTableBody').innerHTML = '<tr><td colspan="5" class="p-8 text-center text-red-400">获取失败: ' + e.message + '</td></tr>';
      }
    }

    function filterList() {
      const missingOnly = document.getElementById('missingOnly').checked;
      const list = missingOnly ? allMovies.filter(m => !m.has_bilingual) : allMovies;
      document.getElementById('statsBadge').innerText = '共匹配 ' + allMovies.length + ' 部影片，当前显示 ' + list.length + ' 部';
      
      const tbody = document.getElementById('movieTableBody');
      if (list.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="p-8 text-center text-gray-500">无符合条件的电影条目</td></tr>';
        return;
      }

      tbody.innerHTML = list.map(m => {
        const subCount = (m.streams || []).filter(s => s.type === 'Subtitle').length;
        const tag = m.has_bilingual
          ? '<span class="text-green-400 text-xs px-2 py-1 rounded bg-green-950/40 border border-green-800"><i class="fa-solid fa-check"></i> 双语已就绪</span>'
          : '<span class="text-amber-400 text-xs px-2 py-1 rounded bg-amber-950/40 border border-amber-800"><i class="fa-solid fa-clock"></i> 待制备</span>';
        
        return '<tr class="hover:bg-[#1c2128]">' +
          '<td class="p-3">' +
            '<div class="font-medium text-white">' + m.name + '</div>' +
            '<div class="text-xs text-gray-400 truncate max-w-md">' + m.path + '</div>' +
          '</td>' +
          '<td class="p-3 text-gray-400">' + (m.year || '-') + '</td>' +
          '<td class="p-3">' +
            '<span class="inline-block px-2 py-0.5 text-xs bg-blue-900/40 text-blue-300 rounded border border-blue-800 mr-1">' + (m.target_audio || '音频') + '</span>' +
            '<span class="inline-block px-2 py-0.5 text-xs bg-gray-800 text-gray-300 rounded">' + subCount + ' 条字幕</span>' +
          '</td>' +
          '<td class="p-3">' + tag + '</td>' +
          '<td class="p-3 text-right">' +
            '<button onclick="refreshMovie(\'' + m.id + '\')" class="px-3 py-1 bg-[#21262d] hover:bg-[#30363d] text-xs text-gray-200 rounded border border-[#30363d]">' +
              '刷新挂载' +
            '</button>' +
          '</td>' +
        '</tr>';
      }).join('');
    }

    async function refreshMovie(id) {
      const res = await fetch('/api/refresh?id=' + id);
      if (res.ok) {
        alert('媒体服务已完成该条目外部字幕感知刷新！');
      } else {
        alert('刷新失败: ' + await res.text());
      }
    }

    window.onload = fetchConfig;
  </script>
</body>
</html>
